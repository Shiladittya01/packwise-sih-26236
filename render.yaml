services:
  - type: web
    name: packwise-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.packwise_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PACKWISE_ALLOWED_ORIGINS
        sync: false
